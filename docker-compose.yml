# Full local stack: API + Inngest dev server + Qdrant + Streamlit UI
#   docker compose up --build
# UI: http://localhost:8501   Inngest dashboard: http://localhost:8288   Qdrant: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      INNGEST_DEV: http://inngest:8288
    volumes: [uploads:/app/uploads]
    ports: ["8000:8000"]
    depends_on: [qdrant]

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://api:8000/api/inngest
    ports: ["8288:8288"]
    depends_on: [api]

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE: http://api:8000
      INNGEST_DEV: http://inngest:8288
      INNGEST_API_BASE: http://inngest:8288/v1
      UPLOADS_DIR: /app/uploads
    volumes: [uploads:/app/uploads]   # shared with the API, which reads the uploaded files
    ports: ["8501:8501"]
    depends_on: [api, inngest]

volumes:
  qdrant_data:
  uploads:
